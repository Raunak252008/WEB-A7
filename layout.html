<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   
        body{
            background-color:rgb(166, 248, 12) ;
            text-align: center;
            
        }
        main{
            width:950px;
            height: 1000px;
            background-color: rgb(12, 207, 233);
            margin: 0 auto;
            padding:0;
            display:flex;
            flex-direction: column;
            gap:10px
        }
        header{
            width:950px;
            height: 80px;
            background-color: aliceblue;

        }

        footer{
            width:950px;
            height: 100px;
            background-color: aliceblue;

        }

        section{
            width:950px;
            height: 400px;
            background-color: lightblue;
            margin-bottom: 20px;
            display: flex;
            flex-direction: row;
            gap:20px;
            column-gap: 20px;
            

        }
        #left{
            flex-grow: 1;
            background-color:lightgray;

        }
        aside,article{
            background-color: azure;
            flex-grow:1;
        }

        #right{
            flex-grow: 2;
            background-color: #777;
            display: flex;
            flex-direction: column;
            gap:10px;

        }
        footer{
            width: 950px;
            height: 100px;
            background-color: aliceblue;
        }


    </style>
</head>
<body>
    <main>
        <header>
            <h2>Header</h2>
        </header>

        <nav>
            <h2>navigation bar</h2>
        </nav>

        <section>
            <div id="left">
                <aside>Aside</aside>
            </div>

            <div id="right">
                <article>Article</article>
            </div>
        </section>

        <footer>
            <h2>footer</h2>
        </footer>
    </main>
</body>
</html>
