<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST IN HTML</title>
</head>
<body>
    <H1>LIST IN HTML</H1>
    <h2>Unordered list</h2>
    <ul type="circle">
        <li>ONE</li>
        <LI>TWO</LI>
        <LI>THREE</LI>
        <LI>FOUR</LI>
        <LI>FIVE</LI>
    </ul>

    <h2>Ordered list</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVA SCRIPT</li>
        <li>B</li>
        <li></li>
    </ol>
    
</body>
</html>
